<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Mercadinho Delivery</title>
  <style>
    :root {
      --primary: #0f9d58;
      --primary-dark: #0b7a43;
      --accent: #ff9800;
      --bg: #f4f6f9;
      --card: #ffffff;
      --text: #1e293b;
      --muted: #64748b;
      --danger: #ef4444;
      --shadow: 0 4px 12px rgba(0, 0, 0, 0.08);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      padding-top: 175px; /* Espaço para o header fixo */
      padding-bottom: 85px;
    }

    /* HEADER FIXO COM CANVAS */
    .fixed-header {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 170px;
      z-index: 1000;
      background: linear-gradient(135deg, #064e3b 0%, #0f9d58 100%);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      overflow: hidden;
    }

    #headerCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .header-content {
      position: relative;
      z-index: 2;
      padding: 12px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      height: 100%;
      justify-content: space-between;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: #fff;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand h1 {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .header-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .icon-btn {
      background: rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      color: #fff;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 5px;
      transition: 0.2s;
    }

    .icon-btn:active {
      transform: scale(0.95);
    }

    .btn-admin {
      background: var(--accent);
      border-color: #ffb74d;
      color: #111;
    }

    /* BUSCA RÁPIDA */
    .search-box {
      position: relative;
      width: 100%;
    }

    .search-box input {
      width: 100%;
      padding: 10px 16px 10px 38px;
      border-radius: 12px;
      border: none;
      font-size: 0.95rem;
      background: rgba(255, 255, 255, 0.95);
      box-shadow: 0 2px 8px rgba(0,0,0,0.15);
      outline: none;
    }

    .search-box span {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 1rem;
    }

    /* CATEGORIAS HORIZONTAIS */
    .categories-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 4px;
      scrollbar-width: none;
    }

    .categories-bar::-webkit-scrollbar {
      display: none;
    }

    .cat-chip {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.25);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.82rem;
      font-weight: 600;
      white-space: nowrap;
      cursor: pointer;
      transition: 0.2s;
    }

    .cat-chip.active {
      background: #fff;
      color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    /* GRADE DE PRODUTOS EM 2 COLUNAS (ESTILO MERCANTIL) */
    .container {
      padding: 12px;
      max-width: 900px;
      margin: 0 auto;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    @media (min-width: 650px) {
      .products-grid {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .product-card {
      background: var(--card);
      border-radius: 14px;
      padding: 10px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      border: 1px solid #e2e8f0;
    }

    .promo-badge {
      position: absolute;
      top: 8px;
      left: 8px;
      background: var(--danger);
      color: #fff;
      font-size: 0.7rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 8px;
      z-index: 2;
      text-transform: uppercase;
    }

    .product-img {
      width: 100%;
      height: 115px;
      object-fit: contain;
      background: #f8fafc;
      border-radius: 10px;
      margin-bottom: 8px;
      padding: 4px;
    }

    .product-cat {
      font-size: 0.7rem;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
    }

    .product-title {
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
      margin: 3px 0 6px;
      line-height: 1.25;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .product-price {
      font-size: 1.1rem;
      font-weight: 800;
      color: var(--primary-dark);
      margin-bottom: 8px;
    }

    .add-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 9px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 0.88rem;
      cursor: pointer;
      transition: 0.2s;
    }

    .add-btn:active {
      background: var(--primary-dark);
      transform: scale(0.97);
    }

    /* BARRA INFERIOR FIXA DO CARRINHO */
    .cart-bar {
      position: fixed;
      bottom: 12px;
      left: 12px;
      right: 12px;
      max-width: 876px;
      margin: 0 auto;
      background: #1e293b;
      color: #fff;
      padding: 14px 18px;
      border-radius: 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
      z-index: 999;
      cursor: pointer;
    }

    .cart-info {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .cart-badge {
      background: var(--accent);
      color: #111;
      font-weight: 800;
      padding: 3px 9px;
      border-radius: 12px;
      font-size: 0.85rem;
    }

    /* MODAIS (LOGIN, CADASTRO, CARRINHO, ADMIN) */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.65);
      backdrop-filter: blur(4px);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      padding: 16px;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 440px;
      border-radius: 18px;
      padding: 20px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.3);
      animation: slideUp 0.25s ease;
    }

    @keyframes slideUp {
      from { transform: translateY(25px); opacity: 0; }
      to { transform: translateY(0); opacity: 1; }
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 10px;
    }

    .close-btn {
      background: #f1f5f9;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 1.1rem;
      cursor: pointer;
      font-weight: bold;
    }

    /* ABAS LOGIN / CADASTRO */
    .auth-tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 16px;
    }

    .auth-tab {
      padding: 10px;
      border: none;
      background: transparent;
      font-weight: 700;
      border-radius: 9px;
      cursor: pointer;
      color: var(--muted);
    }

    .auth-tab.active {
      background: #fff;
      color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-group label {
      display: block;
      font-size: 0.82rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: var(--text);
    }

    .form-group input, .form-group select {
      width: 100%;
      padding: 11px 12px;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    .form-group input:focus, .form-group select:focus {
      border-color: var(--primary);
    }

    .submit-btn {
      width: 100%;
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 13px;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      margin-top: 6px;
    }

    /* LISTA DO CARRINHO */
    .cart-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 0;
      border-bottom: 1px solid #f1f5f9;
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      font-weight: bold;
      cursor: pointer;
    }

    /* TOAST NOTIFICAÇÃO PERSONALIZADA */
    .toast {
      position: fixed;
      top: 185px;
      left: 50%;
      transform: translateX(-50%);
      background: #1e293b;
      color: #fff;
      padding: 10px 18px;
      border-radius: 25px;
      font-size: 0.88rem;
      font-weight: 600;
      z-index: 3000;
      box-shadow: 0 6px 16px rgba(0,0,0,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }

    .toast.show {
      opacity: 1;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 40px 15px;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <!-- CABEÇALHO FIXO COM ANIMAÇÃO CANVAS -->
  <header class="fixed-header">
    <canvas id="headerCanvas"></canvas>
    <div class="header-content">
      <div class="top-bar">
        <div class="brand">
          <span style="font-size: 1.5rem;">🛒</span>
          <h1>Mercadinho Express</h1>
        </div>
        <div class="header-actions">
          <button id="adminBtn" class="icon-btn btn-admin" style="display: none;" onclick="openModal('adminModal')">
            ⚙️ Painel Admin
          </button>
          <button id="authHeaderBtn" class="icon-btn" onclick="handleAuthHeaderClick()">
            👤 Entrar
          </button>
        </div>
      </div>

      <div class="search-box">
        <span>🔍</span>
        <input type="text" id="searchInput" placeholder="Buscar arroz, leite, refrigerante..." oninput="filterProducts()" />
      </div>

      <div class="categories-bar" id="categoriesBar">
        <button class="cat-chip active" data-cat="Todas" onclick="selectCategory('Todas', this)">Todas</button>
        <button class="cat-chip" data-cat="Promoções" onclick="selectCategory('Promoções', this)">🔥 Promoções</button>
        <button class="cat-chip" data-cat="Mercearia" onclick="selectCategory('Mercearia', this)">🥫 Mercearia</button>
        <button class="cat-chip" data-cat="Bebidas" onclick="selectCategory('Bebidas', this)">🥤 Bebidas</button>
        <button class="cat-chip" data-cat="Limpeza" onclick="selectCategory('Limpeza', this)">🧼 Limpeza</button>
        <button class="cat-chip" data-cat="Hortifrúti" onclick="selectCategory('Hortifrúti', this)">🍎 Hortifrúti</button>
        <button class="cat-chip" data-cat="Padaria" onclick="selectCategory('Padaria', this)">🥖 Padaria</button>
      </div>
    </div>
  </header>

  <!-- NOTIFICAÇÃO FLUTUANTE -->
  <div id="toast" class="toast"></div>

  <!-- CATÁLOGO DE PRODUTOS (2 COLUNAS) -->
  <main class="container">
    <div class="products-grid" id="productsGrid">
      <div class="empty-state">Carregando produtos do mercadinho...</div>
    </div>
  </main>

  <!-- BARRA DO CARRINHO -->
  <div class="cart-bar" onclick="openModal('cartModal')">
    <div class="cart-info">
      <span class="cart-badge" id="cartCount">0</span>
      <span style="font-weight: 700;">Ver Carrinho</span>
    </div>
    <div style="font-weight: 800; font-size: 1.05rem;" id="cartTotal">R$ 0,00</div>
  </div>

  <!-- MODAL DE LOGIN / CADASTRO -->
  <div class="modal-overlay" id="authModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="authModalTitle">Acesse sua Conta</h3>
        <button class="close-btn" onclick="closeModal('authModal')">✕</button>
      </div>

      <div class="auth-tabs">
        <button class="auth-tab active" id="tabLogin" onclick="switchAuthTab('login')">Já tenho conta</button>
        <button class="auth-tab" id="tabRegister" onclick="switchAuthTab('register')">Criar Cadastro</button>
      </div>

      <!-- FORMULÁRIO DE LOGIN -->
      <form id="loginForm" onsubmit="loginUser(event)">
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="loginEmail" required placeholder="seu@email.com" />
        </div>
        <div class="form-group">
          <label>Senha</label>
          <input type="password" id="loginPassword" required placeholder="••••••••" />
        </div>
        <button type="submit" class="submit-btn">Entrar no Mercadinho</button>
      </form>

      <!-- FORMULÁRIO DE CADASTRO -->
      <form id="registerForm" style="display: none;" onsubmit="registerUser(event)">
        <div class="form-group">
          <label>Nome Completo</label>
          <input type="text" id="regName" required placeholder="Ex: João da Silva" />
        </div>
        <div class="form-group">
          <label>E-mail</label>
          <input type="email" id="regEmail" required placeholder="seu@email.com" />
        </div>
        <div class="form-group">
          <label>Senha (mínimo 6 caracteres)</label>
          <input type="password" id="regPassword" minlength="6" required placeholder="Crie uma senha" />
        </div>
        <div class="form-group">
          <label>Endereço Completo (Rua, Número, Bairro)</label>
          <input type="text" id="regAddress" required placeholder="Rua das Flores, 123 - Centro" />
        </div>
        <div class="form-group">
          <label>Ponto de Referência</label>
          <input type="text" id="regReference" required placeholder="Próximo à praça / portão azul" />
        </div>
        <button type="submit" class="submit-btn">Criar Conta e Continuar</button>
      </form>
    </div>
  </div>

  <!-- MODAL DO CARRINHO / CHECKOUT -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Seu Carrinho</h3>
        <button class="close-btn" onclick="closeModal('cartModal')">✕</button>
      </div>
      <div id="cartItemsContainer"></div>
      <div id="deliveryAddressPreview" style="margin-top: 12px; font-size: 0.85rem; color: var(--muted);"></div>
      <div style="margin-top: 15px; display: flex; justify-content: space-between; font-weight: 800; font-size: 1.1rem;">
        <span>Total do Pedido:</span>
        <span id="modalCartTotal">R$ 0,00</span>
      </div>
      <button class="submit-btn" onclick="checkoutOrder()">Finalizar Compra</button>
    </div>
  </div>

  <!-- MODAL DO ADMINISTRADOR -->
  <div class="modal-overlay" id="adminModal">
    <div class="modal-box">
      <div class="modal-header">
        <h3>Cadastrar Produto (Admin)</h3>
        <button class="close-btn" onclick="closeModal('adminModal')">✕</button>
      </div>
      <form onsubmit="addProduct(event)">
        <div class="form-group">
          <label>Nome do Produto</label>
          <input type="text" id="prodName" required placeholder="Ex: Arroz Branco 5kg" />
        </div>
        <div class="form-group">
          <label>Preço (R$)</label>
          <input type="number" step="0.01" id="prodPrice" required placeholder="Ex: 24.90" />
        </div>
        <div class="form-group">
          <label>Categoria</label>
          <select id="prodCategory">
            <option value="Mercearia">Mercearia</option>
            <option value="Bebidas">Bebidas</option>
            <option value="Limpeza">Limpeza</option>
            <option value="Hortifrúti">Hortifrúti</option>
            <option value="Padaria">Padaria</option>
          </select>
        </div>
        <div class="form-group">
          <label>URL da Imagem (ou deixe vazio para ícone padrão)</label>
          <input type="url" id="prodImage" placeholder="https://exemplo.com/foto.jpg" />
        </div>
        <div class="form-group" style="display: flex; align-items: center; gap: 8px;">
          <input type="checkbox" id="prodPromo" style="width: auto;" />
          <label for="prodPromo" style="margin: 0;">Destacar em Promoções 🔥</label>
        </div>
        <button type="submit" class="submit-btn">Salvar Produto no Catálogo</button>
      </form>
    </div>
  </div>

  <!-- FIREBASE SDKs + LÓGICA DO APP -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import {
      getAuth,
      createUserWithEmailAndPassword,
      signInWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
    import {
      getFirestore,
      collection,
      addDoc,
      getDocs,
      doc,
      setDoc,
      getDoc,
      onSnapshot,
      query,
      orderBy
    } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    // =========================================================================
    // COLE AQUI AS CREDENCIAIS DO SEU PROJETO FIREBASE
    // =========================================================================
    const firebaseConfig = {
      apiKey: "SUA_API_KEY",
      authDomain: "SEU_PROJETO.firebaseapp.com",
      projectId: "SEU_PROJETO",
      storageBucket: "SEU_PROJETO.appspot.com",
      messagingSenderId: "SEU_SENDER_ID",
      appId: "SEU_APP_ID"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // Estado global
    let allProducts = [];
    let cart = JSON.parse(localStorage.getItem('mercadinho_cart') || '[]');
    let currentCategory = 'Todas';
    let currentUser = null;
    let currentUserProfile = null;
    let pendingCheckout = false;

    // =========================================================================
    // ANIMAÇÃO CANVAS NO CABEÇALHO FIXO
    // =========================================================================
    const canvas = document.getElementById('headerCanvas');
    const ctx = canvas.getContext('2d');
    let particles = [];
    const symbols = ['🛒', '🍎', '🥖', '🥛', '✨', '🥬'];

    function resizeCanvas() {
      canvas.width = canvas.offsetWidth;
      canvas.height = canvas.offsetHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = (Math.random() - 0.5) * 0.8;
        this.radius = Math.random() * 2.5 + 1;
        this.isSymbol = Math.random() < 0.22;
        this.symbol = symbols[Math.floor(Math.random() * symbols.length)];
      }
      update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
        if (this.y < 0 || this.y > canvas.height) this.vy *= -1;
      }
      draw() {
        if (this.isSymbol) {
          ctx.font = '14px sans-serif';
          ctx.globalAlpha = 0.25;
          ctx.fillText(this.symbol, this.x, this.y);
          ctx.globalAlpha = 1;
        } else {
          ctx.beginPath();
          ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
          ctx.fillStyle = 'rgba(255, 255, 255, 0.35)';
          ctx.fill();
        }
      }
    }

    for (let i = 0; i < 28; i++) particles.push(new Particle());

    function animateCanvas() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      for (let i = 0; i < particles.length; i++) {
        particles[i].update();
        particles[i].draw();
        for (let j = i + 1; j < particles.length; j++) {
          const dx = particles[i].x - particles[j].x;
          const dy = particles[i].y - particles[j].y;
          const dist = Math.hypot(dx, dy);
          if (dist < 75) {
            ctx.beginPath();
            ctx.strokeStyle = `rgba(255, 255, 255, ${0.18 * (1 - dist / 75)})`;
            ctx.lineWidth = 1;
            ctx.moveTo(particles[i].x, particles[i].y);
            ctx.lineTo(particles[j].x, particles[j].y);
            ctx.stroke();
          }
        }
      }
      requestAnimationFrame(animateCanvas);
    }
    animateCanvas();

    // =========================================================================
    // UTILITÁRIOS DE INTERFACE
    // =========================================================================
    window.showToast = (msg) => {
      const toast = document.getElementById('toast');
      toast.textContent = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    };

    window.openModal = (id) => {
      if (id === 'cartModal') renderCartModal();
      document.getElementById(id).classList.add('open');
    };

    window.closeModal = (id) => {
      document.getElementById(id).classList.remove('open');
    };

    window.switchAuthTab = (tab) => {
      const isLogin = tab === 'login';
      document.getElementById('tabLogin').classList.toggle('active', isLogin);
      document.getElementById('tabRegister').classList.toggle('active', !isLogin);
      document.getElementById('loginForm').style.display = isLogin ? 'block' : 'none';
      document.getElementById('registerForm').style.display = isLogin ? 'none' : 'block';
      document.getElementById('authModalTitle').textContent = isLogin ? 'Entrar na Conta' : 'Criar Meu Cadastro';
    };

    // =========================================================================
    // AUTENTICAÇÃO E PERFIL NO FIRESTORE (SEM SENHA NO CÓDIGO)
    // =========================================================================
    onAuthStateChanged(auth, async (user) => {
      currentUser = user;
      const authBtn = document.getElementById('authHeaderBtn');
      const adminBtn = document.getElementById('adminBtn');

      if (user) {
        const userDoc = await getDoc(doc(db, "usuarios", user.uid));
        currentUserProfile = userDoc.exists() ? userDoc.data() : { nome: user.email, role: 'cliente' };

        const firstName = currentUserProfile.nome.split(' ')[0];
        authBtn.textContent = `👋 ${firstName} (Sair)`;
        adminBtn.style.display = currentUserProfile.role === 'admin' ? 'flex' : 'none';
      } else {
        currentUserProfile = null;
        authBtn.textContent = '👤 Entrar';
        adminBtn.style.display = 'none';
      }
    });

    window.handleAuthHeaderClick = async () => {
      if (currentUser) {
        await signOut(auth);
        showToast('Você saiu da sua conta.');
      } else {
        switchAuthTab('login');
        openModal('authModal');
      }
    };

    window.registerUser = async (e) => {
      e.preventDefault();
      const nome = document.getElementById('regName').value.trim();
      const email = document.getElementById('regEmail').value.trim();
      const senha = document.getElementById('regPassword').value;
      const endereco = document.getElementById('regAddress').value.trim();
      const referencia = document.getElementById('regReference').value.trim();

      try {
        // Verifica se já existe algum usuário cadastrado para definir o 1º como Admin
        const usersSnap = await getDocs(collection(db, "usuarios"));
        const isFirstUser = usersSnap.empty;

        const cred = await createUserWithEmailAndPassword(auth, email, senha);
        await setDoc(doc(db, "usuarios", cred.user.uid), {
          nome,
          email,
          endereco,
          referencia,
          role: isFirstUser ? 'admin' : 'cliente',
          criadoEm: new Date().toISOString()
        });

        closeModal('authModal');
        showToast(isFirstUser
          ? 'Conta Administrador criada com sucesso!'
          : 'Cadastro realizado! Bem-vindo ao mercadinho.');

        if (pendingCheckout) {
          pendingCheckout = false;
          openModal('cartModal');
        }
      } catch (err) {
        showToast('Erro ao cadastrar: ' + err.message);
      }
    };

    window.loginUser = async (e) => {
      e.preventDefault();
      const email = document.getElementById('loginEmail').value.trim();
      const senha = document.getElementById('loginPassword').value;

      try {
        await signInWithEmailAndPassword(auth, email, senha);
        closeModal('authModal');
        showToast('Login realizado com sucesso!');

        if (pendingCheckout) {
          pendingCheckout = false;
          openModal('cartModal');
        }
      } catch (err) {
        showToast('E-mail ou senha inválidos.');
      }
    };

    // =========================================================================
    // PRODUTOS E CATÁLOGO EM TEMPO REAL
    // =========================================================================
    const productsQuery = query(collection(db, "produtos"), orderBy("nome"));
    onSnapshot(productsQuery, (snapshot) => {
      allProducts = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
      renderProducts();
    }, () => {
      // Fallback caso as regras do Firebase ainda não tenham sido configuradas
      document.getElementById('productsGrid').innerHTML = `
        <div class="empty-state">
          Configure suas chaves do Firebase no código para carregar e cadastrar produtos em tempo real.
        </div>`;
    });

    window.addProduct = async (e) => {
      e.preventDefault();
      if (!currentUserProfile || currentUserProfile.role !== 'admin') {
        showToast('Apenas o administrador pode cadastrar produtos.');
        return;
      }

      const nome = document.getElementById('prodName').value.trim();
      const preco = parseFloat(document.getElementById('prodPrice').value);
      const categoria = document.getElementById('prodCategory').value;
      const imagem = document.getElementById('prodImage').value.trim() || 'https://cdn-icons-png.flaticon.com/512/3081/3081986.png';
      const promocao = document.getElementById('prodPromo').checked;

      try {
        await addDoc(collection(db, "produtos"), {
          nome,
          preco,
          categoria,
          imagem,
          promocao,
          criadoEm: new Date().toISOString()
        });
        e.target.reset();
        closeModal('adminModal');
        showToast('Produto adicionado ao catálogo!');
      } catch (err) {
        showToast('Erro ao salvar produto: ' + err.message);
      }
    };

    window.selectCategory = (cat, btn) => {
      currentCategory = cat;
      document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
      btn.classList.add('active');
      renderProducts();
    };

    window.filterProducts = () => renderProducts();

    function renderProducts() {
      const term = document.getElementById('searchInput').value.toLowerCase();
      const grid = document.getElementById('productsGrid');

      const filtered = allProducts.filter(p => {
        const matchSearch = p.nome.toLowerCase().includes(term);
        const matchCat =
          currentCategory === 'Todas' ||
          (currentCategory === 'Promoções' && p.promocao) ||
          p.categoria === currentCategory;
        return matchSearch && matchCat;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div class="empty-state">Nenhum produto encontrado nesta categoria.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(prod => `
        <div class="product-card">
          ${prod.promocao ? '<span class="promo-badge">Oferta</span>' : ''}
          <img src="${prod.imagem}" alt="${prod.nome}" class="product-img" />
          <div>
            <div class="product-cat">${prod.categoria}</div>
            <div class="product-title">${prod.nome}</div>
            <div class="product-price">R$ ${prod.preco.toFixed(2).replace('.', ',')}</div>
            <button class="add-btn" onclick="addToCart('${prod.id}')">+ Adicionar</button>
          </div>
        </div>
      `).join('');
    }

    // =========================================================================
    // CARRINHO E FINALIZAÇÃO DE PEDIDO
    // =========================================================================
    window.addToCart = (id) => {
      const prod = allProducts.find(p => p.id === id);
      if (!prod) return;
      const existing = cart.find(item => item.id === id);
      if (existing) existing.qtd++;
      else cart.push({ ...prod, qtd: 1 });

      saveCart();
      showToast(`${prod.nome} adicionado!`);
    };

    window.changeQty = (id, delta) => {
      const item = cart.find(i => i.id === id);
      if (!item) return;
      item.qtd += delta;
      if (item.qtd <= 0) cart = cart.filter(i => i.id !== id);
      saveCart();
      renderCartModal();
    };

    function saveCart() {
      localStorage.setItem('mercadinho_cart', JSON.stringify(cart));
      const totalItems = cart.reduce((acc, i) => acc + i.qtd, 0);
      const totalPrice = cart.reduce((acc, i) => acc + (i.preco * i.qtd), 0);
      document.getElementById('cartCount').textContent = totalItems;
      document.getElementById('cartTotal').textContent = `R$ ${totalPrice.toFixed(2).replace('.', ',')}`;
    }

    function renderCartModal() {
      const container = document.getElementById('cartItemsContainer');
      const addrPreview = document.getElementById('deliveryAddressPreview');
      const totalPrice = cart.reduce((acc, i) => acc + (i.preco * i.qtd), 0);

      document.getElementById('modalCartTotal').textContent = `R$ ${totalPrice.toFixed(2).replace('.', ',')}`;

      if (cart.length === 0) {
        container.innerHTML = '<p style="text-align:center; padding: 20px; color:#64748b;">Seu carrinho está vazio.</p>';
        addrPreview.innerHTML = '';
        return;
      }

      container.innerHTML = cart.map(item => `
        <div class="cart-item">
          <div>
            <div style="font-weight:700; font-size:0.92rem;">${item.nome}</div>
            <div style="font-size:0.82rem; color:#0b7a43; font-weight:700;">
              R$ ${(item.preco * item.qtd).toFixed(2).replace('.', ',')}
            </div>
          </div>
          <div class="qty-controls">
            <button class="qty-btn" onclick="changeQty('${item.id}', -1)">-</button>
            <span style="font-weight:700;">${item.qtd}</span>
            <button class="qty-btn" onclick="changeQty('${item.id}', 1)">+</button>
          </div>
        </div>
      `).join('');

      if (currentUserProfile) {
        addrPreview.innerHTML = `<strong>Entrega para:</strong> ${currentUserProfile.endereco} (${currentUserProfile.referencia})`;
      } else {
        addrPreview.innerHTML = `<em>Você fará login ou cadastro ao finalizar a compra.</em>`;
      }
    }

    window.checkoutOrder = async () => {
      if (cart.length === 0) {
        showToast('Adicione itens ao carrinho primeiro.');
        return;
      }

      // Exige login/cadastro apenas na hora de finalizar
      if (!currentUser) {
        pendingCheckout = true;
        closeModal('cartModal');
        switchAuthTab('register');
        openModal('authModal');
        showToast('Crie seu cadastro ou entre para finalizar o pedido.');
        return;
      }

      const total = cart.reduce((acc, i) => acc + (i.preco * i.qtd), 0);

      try {
        await addDoc(collection(db, "pedidos"), {
          clienteId: currentUser.uid,
          clienteNome: currentUserProfile.nome,
          endereco: currentUserProfile.endereco,
          referencia: currentUserProfile.referencia,
          itens: cart,
          total,
          status: 'Novo Pedido',
          data: new Date().toISOString()
        });

        cart = [];
        saveCart();
        closeModal('cartModal');
        showToast('Pedido enviado com sucesso! Em breve sairá para entrega.');
      } catch (err) {
        showToast('Erro ao enviar pedido: ' + err.message);
      }
    };

    saveCart();
  </script>
</body>
</html>
