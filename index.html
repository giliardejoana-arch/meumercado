<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Meu Mercadinho Online</title>
  <style>
    :root {
      --bg: #f4f6f8;
      --surface: #ffffff;
      --surface-2: #eef2f6;
      --text: #141b24;
      --muted: #5c6b7c;
      --primary: #0f766e;
      --primary-dark: #115e59;
      --accent: #ea580c;
      --accent-soft: #ffedd5;
      --danger: #dc2626;
      --success: #15803d;
      --border: #dce3ec;
      --shadow: 0 6px 18px rgba(15, 23, 42, 0.08);
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 40px;
    }

    /* Cabeçalho */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .header-left {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .icon-btn {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 9px 12px;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .icon-btn:hover {
      background: #e2e8f0;
    }

    .brand-title {
      font-size: 1.05rem;
      font-weight: 800;
      color: var(--primary-dark);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .cart-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 13px;
      font-size: 0.92rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
    }

    .cart-btn:hover {
      background: var(--primary-dark);
    }

    .cart-badge {
      background: var(--accent);
      color: #fff;
      border-radius: 999px;
      padding: 2px 7px;
      font-size: 0.78rem;
      font-weight: 800;
    }

    /* Banner Canvas */
    .banner-wrap {
      max-width: 960px;
      margin: 12px auto 0;
      padding: 0 12px;
    }

    .banner-box {
      position: relative;
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      background: #0f172a;
      height: 125px;
    }

    #promoCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .banner-overlay {
      position: absolute;
      inset: 0;
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background: linear-gradient(90deg, rgba(15, 23, 42, 0.82) 0%, rgba(15, 23, 42, 0.35) 100%);
      color: #fff;
      pointer-events: none;
    }

    .banner-overlay h1 {
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 4px;
    }

    .banner-overlay p {
      font-size: 0.88rem;
      color: #e2e8f0;
    }

    /* Container principal */
    .container {
      max-width: 960px;
      margin: 14px auto 0;
      padding: 0 12px;
    }

    /* Avisos na tela */
    .notice-bar {
      display: none;
      margin-bottom: 12px;
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.4;
      border: 1px solid transparent;
    }

    .notice-bar.show {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .notice-info {
      background: #e0f2fe;
      color: #0c4a6e;
      border-color: #bae6fd;
    }

    .notice-success {
      background: #dcfce7;
      color: #14532d;
      border-color: #bbf7d0;
    }

    .notice-error {
      background: #fee2e2;
      color: #7f1d1d;
      border-color: #fecaca;
    }

    .notice-close {
      background: transparent;
      border: none;
      color: inherit;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
      padding: 2px 6px;
    }

    /* Barra de busca e categorias */
    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .search-input {
      width: 100%;
      padding: 11px 13px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.95rem;
      background: var(--bg);
      color: var(--text);
    }

    .search-input:focus {
      outline: 2px solid var(--primary);
      background: #fff;
    }

    .filter-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 2px;
    }

    .chip {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 999px;
      padding: 7px 13px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .chip.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }

    .chip.promo-chip.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }

    /* Grade obrigatória de 2 colunas */
    .products-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .product-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    .promo-tag {
      position: absolute;
      top: 8px;
      left: 8px;
      z-index: 2;
      background: var(--accent);
      color: #fff;
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 8px;
      border-radius: 999px;
      text-transform: uppercase;
    }

    .hidden-tag {
      position: absolute;
      top: 8px;
      right: 8px;
      z-index: 2;
      background: #334155;
      color: #fff;
      font-size: 0.7rem;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 999px;
    }

    .product-img-wrap {
      width: 100%;
      height: 132px;
      background: var(--surface-2);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .product-img-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-body {
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }

    .product-cat {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
    }

    .product-name {
      font-size: 0.95rem;
      font-weight: 800;
      line-height: 1.25;
      color: var(--text);
    }

    .price-box {
      display: flex;
      align-items: baseline;
      gap: 6px;
      flex-wrap: wrap;
      margin-top: auto;
    }

    .price-old {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: line-through;
    }

    .price-now {
      font-size: 1.02rem;
      font-weight: 800;
      color: var(--primary-dark);
    }

    .price-promo {
      color: var(--accent);
    }

    .add-btn {
      width: 100%;
      margin-top: 4px;
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 9px 8px;
      font-size: 0.86rem;
      font-weight: 700;
      cursor: pointer;
    }

    .add-btn:hover {
      background: var(--primary-dark);
    }

    .admin-mini-actions {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      margin-top: 6px;
      padding-top: 6px;
      border-top: 1px dashed var(--border);
    }

    .mini-btn {
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      border-radius: 7px;
      padding: 5px 4px;
      font-size: 0.72rem;
      font-weight: 700;
      cursor: pointer;
    }

    .mini-btn.del {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fecaca;
    }

    /* Painel do Administrador */
    .admin-panel {
      display: none;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px;
      margin-top: 16px;
      box-shadow: var(--shadow);
    }

    .admin-panel.active {
      display: block;
    }

    .admin-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-bottom: 12px;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--border);
    }

    .admin-tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    @media (min-width: 640px) {
      .form-grid.two-col {
        grid-template-columns: repeat(2, 1fr);
      }
      .products-grid {
        gap: 14px;
      }
      .product-img-wrap {
        height: 165px;
      }
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .field label {
      font-size: 0.84rem;
      font-weight: 700;
      color: var(--text);
    }

    .field input,
    .field select,
    .field textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.94rem;
      background: #fff;
      color: var(--text);
    }

    .checkbox-line {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      font-weight: 700;
      padding: 6px 0;
    }

    .checkbox-line input {
      width: 18px;
      height: 18px;
    }

    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 0.95rem;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .btn-primary:disabled {
      opacity: 0.75;
      cursor: not-allowed;
    }

    .btn-whatsapp {
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 0.96rem;
      font-weight: 800;
      cursor: pointer;
      width: 100%;
    }

    .btn-whatsapp:hover {
      background: #15803d;
    }

    .btn-secondary {
      background: var(--surface-2);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
    }

    /* Menu gaveta lateral */
    .drawer-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.5);
      z-index: 60;
      display: none;
    }

    .drawer-backdrop.open {
      display: block;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: 290px;
      max-width: 85vw;
      background: var(--surface);
      z-index: 70;
      transform: translateX(-100%);
      transition: transform 0.22s ease;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: var(--shadow);
    }

    .drawer.open {
      transform: translateX(0);
    }

    .drawer-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 10px;
      border-bottom: 1px solid var(--border);
    }

    .user-box {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 0.86rem;
      line-height: 1.4;
    }

    .drawer-item {
      width: 100%;
      text-align: left;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 0.92rem;
      font-weight: 700;
      color: var(--text);
      cursor: pointer;
    }

    .drawer-item:hover {
      background: #e2e8f0;
    }

    /* Modais (Carrinho e Conta/Cadastro) */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.58);
      z-index: 80;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 12px;
    }

    .modal-backdrop.open {
      display: flex;
    }

    .modal-card {
      background: var(--surface);
      border-radius: var(--radius);
      width: 100%;
      max-width: 480px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 16px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .modal-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      padding-bottom: 10px;
    }

    .modal-head h2 {
      font-size: 1.05rem;
      font-weight: 800;
    }

    .close-x {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px 10px;
      font-weight: 800;
      cursor: pointer;
    }

    .cart-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
    }

    .cart-item-info {
      min-width: 0;
      flex: 1;
    }

    .cart-item-name {
      font-size: 0.92rem;
      font-weight: 700;
    }

    .cart-item-sub {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .qty-controls {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .qty-btn {
      width: 28px;
      height: 28px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      font-weight: 800;
      cursor: pointer;
    }

    .total-line {
      display: flex;
      justify-content: space-between;
      font-size: 1.08rem;
      font-weight: 800;
      padding: 8px 0;
    }

    .auth-switch {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px;
      background: var(--surface-2);
      padding: 4px;
      border-radius: 10px;
    }

    .auth-switch button {
      border: none;
      background: transparent;
      padding: 8px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.88rem;
      cursor: pointer;
      color: var(--muted);
    }

    .auth-switch button.active {
      background: #fff;
      color: var(--primary-dark);
      box-shadow: 0 2px 6px rgba(0,0,0,0.08);
    }

    .inline-msg {
      display: none;
      padding: 9px 11px;
      border-radius: 9px;
      font-size: 0.86rem;
      font-weight: 700;
    }

    .inline-msg.show {
      display: block;
    }

    .inline-msg.ok {
      background: #dcfce7;
      color: #14532d;
    }

    .inline-msg.err {
      background: #fee2e2;
      color: #7f1d1d;
    }

    .empty-state {
      grid-column: 1 / -1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 16px;
      text-align: center;
      color: var(--muted);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header>
    <div class="header-left">
      <button class="icon-btn" id="openDrawerBtn" type="button">☰ Menu</button>
      <div class="brand-title">Meu Mercadinho Online</div>
    </div>
    <button class="cart-btn" id="openCartBtn" type="button">
      🛒 Carrinho <span class="cart-badge" id="cartCount">0</span>
    </button>
  </header>

  <div class="banner-wrap">
    <div class="banner-box">
      <canvas id="promoCanvas"></canvas>
      <div class="banner-overlay">
        <h1>Meu Mercadinho Online</h1>
        <p>Monte seu carrinho e receba na porta de casa em poucos minutos.</p>
      </div>
    </div>
  </div>

  <main class="container">
    <div id="globalNotice" class="notice-bar" role="status">
      <span id="globalNoticeText"></span>
      <button class="notice-close" id="closeNoticeBtn" type="button" aria-label="Fechar aviso">✕</button>
    </div>

    <section class="toolbar">
      <input
        type="search"
        id="searchInput"
        class="search-input"
        placeholder="Buscar produto no mercadinho..."
        autocomplete="off"
      />
      <div class="filter-row" id="categoryRow">
        <button class="chip active" data-filter="all" type="button">Todos</button>
        <button class="chip promo-chip" data-filter="promo" type="button">🔥 Promoções</button>
        <button class="chip" data-filter="Mercearia" type="button">Mercearia</button>
        <button class="chip" data-filter="Bebidas" type="button">Bebidas</button>
        <button class="chip" data-filter="Limpeza" type="button">Limpeza</button>
        <button class="chip" data-filter="Hortifruti" type="button">Hortifruti</button>
        <button class="chip" data-filter="Padaria" type="button">Padaria</button>
      </div>
    </section>

    <section class="products-grid" id="productsGrid"></section>

    <!-- Painel do Administrador (exibido apenas quando a conta estiver autorizada no Firestore) -->
    <section class="admin-panel" id="adminPanel">
      <div class="admin-header">
        <h2>Gerenciamento da Loja</h2>
        <button class="icon-btn" id="closeAdminPanelBtn" type="button">Fechar</button>
      </div>

      <div class="admin-tabs">
        <button class="chip active" id="tabProductBtn" type="button">Produto</button>
        <button class="chip" id="tabStoreBtn" type="button">WhatsApp da Loja</button>
      </div>

      <div id="adminProductTab">
        <form id="productForm" class="form-grid">
          <input type="hidden" id="editProductId" />
          <div class="form-grid two-col">
            <div class="field">
              <label for="prodName">Nome do produto *</label>
              <input type="text" id="prodName" required placeholder="Ex.: Arroz Branco 5kg" />
            </div>
            <div class="field">
              <label for="prodCategory">Categoria *</label>
              <select id="prodCategory" required>
                <option value="Mercearia">Mercearia</option>
                <option value="Bebidas">Bebidas</option>
                <option value="Limpeza">Limpeza</option>
                <option value="Hortifruti">Hortifruti</option>
                <option value="Padaria">Padaria</option>
                <option value="Outros">Outros</option>
              </select>
            </div>
          </div>

          <div class="form-grid two-col">
            <div class="field">
              <label for="prodPrice">Preço normal (R$) *</label>
              <input type="number" id="prodPrice" step="0.01" min="0.01" required placeholder="Ex.: 24.90" />
            </div>
            <div class="field">
              <label for="prodPromoPrice">Preço promocional (R$)</label>
              <input type="number" id="prodPromoPrice" step="0.01" min="0.01" placeholder="Ex.: 21.50" />
            </div>
          </div>

          <div class="field">
            <label for="prodPhoto">Link da foto do produto (GitHub Raw ou URL da imagem) *</label>
            <input type="url" id="prodPhoto" required placeholder="https://raw.githubusercontent.com/..." />
          </div>

          <div class="form-grid two-col">
            <label class="checkbox-line">
              <input type="checkbox" id="prodIsPromo" />
              <span>Marcar como Promoção</span>
            </label>
            <label class="checkbox-line">
              <input type="checkbox" id="prodHidden" />
              <span>Ocultar produto dos clientes</span>
            </label>
          </div>

          <div class="form-grid two-col">
            <button type="submit" class="btn-primary" id="saveProductBtn">Salvar produto</button>
            <button type="button" class="btn-secondary" id="resetProductFormBtn">Limpar campos</button>
          </div>
        </form>
      </div>

      <div id="adminStoreTab" style="display: none;">
        <form id="storeConfigForm" class="form-grid">
          <div class="field">
            <label for="storeWhatsapp">Número do WhatsApp para receber pedidos (com DDD e código do país)</label>
            <input type="text" id="storeWhatsapp" placeholder="Ex.: 5585999999999" required />
          </div>
          <button type="submit" class="btn-primary" id="saveStoreBtn">Salvar WhatsApp</button>
        </form>
      </div>
    </section>
  </main>

  <!-- Menu Gaveta -->
  <div class="drawer-backdrop" id="drawerBackdrop"></div>
  <aside class="drawer" id="drawer">
    <div class="drawer-top">
      <strong>Menu</strong>
      <button class="close-x" id="closeDrawerBtn" type="button">✕</button>
    </div>

    <div class="user-box" id="drawerUserBox">
      Visitante — adicione itens ao carrinho e cadastre-se na hora de fechar o pedido.
    </div>

    <button class="drawer-item" id="drawerHomeBtn" type="button">🛍️ Catálogo</button>
    <button class="drawer-item" id="drawerPromoBtn" type="button">🔥 Promoções</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";

    const firebaseConfig = {

      authDomain: "mercadinho-oline.firebaseapp.com",
      projectId: "mercadinho-oline",

      appId: "1:521985833583:web:d51535344b2b173fb66b9a",
      measurementId: "G-83JPHJG1QT"

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const STORAGE_CART_KEY = "mmo_cart_v1";
    const STORAGE_PRODUCTS_KEY = "mmo_products_cache_v1";
    const STORAGE_STORE_KEY = "mmo_store_cache_v1";

    const DEFAULT_PRODUCTS = [
      {
        id: "demo-1",
        name: "Arroz Parboilizado 5kg",
        category: "Mercearia",
        price: 26.50,
        promoPrice: 22.90,
        isPromo: true,
        hidden: false,
        photo: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=600&auto=format&fit=crop&q=75"
      },
      {
        id: "demo-2",
        name: "Refrigerante Cola 2L",
        category: "Bebidas",
        price: 9.50,
        promoPrice: null,
        isPromo: false,
        hidden: false,
        photo: "https://images.unsplash.com/photo-1629203851122-3726ecdf080e?w=600&auto=format&fit=crop&q=75"
      },
      {
        id: "demo-3",
        name: "Detergente Líquido 500ml",

        price: 2.80,
        promoPrice: 2.20,

        photo: "https://images.unsplash.com/photo-1585421514284-efb74c2b69ba?w=600&auto=format&fit=crop&q=75"

        photo: "https://images.unsplash.com/photo-1571771894821-ce9b6c11b08e?w=600&auto=format&fit=crop&q=75"
      }
    ];

    let state = {
      products: loadJSON(STORAGE_PRODUCTS_KEY, DEFAULT_PRODUCTS),
      cart: loadJSON(STORAGE_CART_KEY, []),
      store: loadJSON(STORAGE_STORE_KEY, { whatsapp: "5585999999999" }),
      user: null,
      profile: loadJSON(STORAGE_USER_PROFILE_KEY, null),
      isAdmin: false,
      filter: "all",
      search: "",
      pendingCheckoutAfterAuth: false
    };

    function loadJSON(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        return raw ? JSON.parse(raw) : fallback;
      } catch {
        return fallback;
      }
    }

    function saveJSON(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
      } catch {}
    }

    function formatBRL(val) {
      return Number(val || 0).toLocaleString("pt-BR", {
        style: "currency",
        currency: "BRL"
      });
    }

    function getEffectivePrice(prod) {
      if (prod.isPromo && prod.promoPrice && Number(prod.promoPrice) > 0 && Number(prod.promoPrice) < Number(prod.price)) {
        return Number(prod.promoPrice);
      }
      return Number(prod.price || 0);
    }

    function withTimeout(promise, ms = 8000) {
      return Promise.race([
        promise,
        new Promise((_, reject) => setTimeout(() => reject(new Error("Tempo limite excedido.")), ms))
      ]);
    }

    // Banner animado em HTML5 Canvas
    const canvas = document.getElementById("promoCanvas");
    const ctx = canvas.getContext("2d");
    let animAngle = 0;

    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = Math.max(1, Math.floor(rect.width));
      canvas.height = Math.max(1, Math.floor(rect.height));
    }

    function drawBanner() {
      resizeCanvas();
      animAngle += 0.015;
      const w = canvas.width;
      const h = canvas.height;

      const grad = ctx.createLinearGradient(0, 0, w, h);
      grad.addColorStop(0, "#0f766e");
      grad.addColorStop(0.55, "#115e59");
      grad.addColorStop(1, "#ea580c");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.save();
      ctx.globalAlpha = 0.22;
      for (let i = 0; i < 6; i++) {
        const cx = ((i * 150 + Math.sin(animAngle + i) * 28) % (w + 80));
        const cy = 22 + ((i * 29 + Math.cos(animAngle + i * 0.7) * 14) % Math.max(30, h - 20));
        const r = 18 + (i % 3) * 10;
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI * 2);
        ctx.fillStyle = i % 2 === 0 ? "#ffffff" : "#fed7aa";
        ctx.fill();
      }
      ctx.restore();

      requestAnimationFrame(drawBanner);
    }
    requestAnimationFrame(drawBanner);

    // Avisos na tela
    const globalNotice = document.getElementById("globalNotice");
    const globalNoticeText = document.getElementById("globalNoticeText");
    document.getElementById("closeNoticeBtn").addEventListener("click", () => {
      globalNotice.classList.remove("show");
    });

    function showNotice(message, type = "info") {
      globalNotice.className = `notice-bar show notice-${type}`;
      globalNoticeText.textContent = message;
    }

    // Menu gaveta
    const drawer = document.getElementById("drawer");
    const drawerBackdrop = document.getElementById("drawerBackdrop");

    function openDrawer() {
      drawer.classList.add("open");
      drawerBackdrop.classList.add("open");
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      drawerBackdrop.classList.remove("open");
    }

    document.getElementById("openDrawerBtn").addEventListener("click", openDrawer);
    document.getElementById("closeDrawerBtn").addEventListener("click", closeDrawer);
    drawerBackdrop.addEventListener("click", closeDrawer);

    document.getElementById("drawerHomeBtn").addEventListener("click", () => {
      state.filter = "all";
      updateFilterChips();
      renderProducts();
      closeDrawer();
    });

    document.getElementById("drawerPromoBtn").addEventListener("click", () => {
      state.filter = "promo";
      updateFilterChips();
      renderProducts();
      closeDrawer();
    });

    document.getElementById("drawerCartBtn").addEventListener("click", () => {
      closeDrawer();
      openCartModal();
    });

    document.getElementById("drawerAuthBtn").addEventListener("click", () => {
      closeDrawer();
      openAuthModal("register");
    });

    document.getElementById("drawerAdminBtn").addEventListener("click", () => {
      closeDrawer();
      if (state.isAdmin) {
        document.getElementById("adminPanel").classList.add("active");
        document.getElementById("adminPanel").scrollIntoView({ behavior: "smooth" });
      }
    });

    document.getElementById("drawerLogoutBtn").addEventListener("click", async () => {
      closeDrawer();
      try {
        await signOut(auth);
      } catch {}
      state.user = null;
      state.profile = null;
      state.isAdmin = false;
      saveJSON(STORAGE_USER_PROFILE_KEY, null);
      document.getElementById("adminPanel").classList.remove("active");
      updateUserUI();
      renderProducts();
      showNotice("Você saiu da conta.", "info");
    });

    function updateUserUI() {
      const box = document.getElementById("drawerUserBox");
      const adminBtn = document.getElementById("drawerAdminBtn");
      const logoutBtn = document.getElementById("drawerLogoutBtn");
      const authBtn = document.getElementById("drawerAuthBtn");

      if (state.user) {
        const nome = (state.profile && state.profile.name) || state.user.email || "Cliente";
        const end = (state.profile && state.profile.address) ? `<br>📍 ${state.profile.address}` : "";
        const ref = (state.profile && state.profile.landmark) ? `<br>🧭 Ref.: ${state.profile.landmark}` : "";
        box.innerHTML = `<strong>${escapeHTML(nome)}</strong><br>${escapeHTML(state.user.email || "")}${end}${ref}`;
        authBtn.textContent = "✏️ Atualizar Cadastro";
        logoutBtn.style.display = "block";
        adminBtn.style.display = state.isAdmin ? "block" : "none";
        if (!state.isAdmin) {
          document.getElementById("adminPanel").classList.remove("active");
        }
      } else {
        box.innerHTML = "Visitante — adicione itens ao carrinho e cadastre-se na hora de fechar o pedido.";
        authBtn.textContent = "👤 Entrar ou Cadastrar";
        logoutBtn.style.display = "none";
        adminBtn.style.display = "none";
        document.getElementById("adminPanel").classList.remove("active");
      }
    }

    function escapeHTML(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    // Filtros e busca
    function updateFilterChips() {
      document.querySelectorAll("#categoryRow .chip").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.filter === state.filter);
      });
    }

    document.querySelectorAll("#categoryRow .chip").forEach((btn) => {
      btn.addEventListener("click", () => {
        state.filter = btn.dataset.filter;
        updateFilterChips();
        renderProducts();
      });
    });

    document.getElementById("searchInput").addEventListener("input", (e) => {
      state.search = e.target.value.trim().toLowerCase();
      renderProducts();
    });

    // Renderização da vitrine (sempre 2 colunas)
    const productsGrid = document.getElementById("productsGrid");

    function renderProducts() {
      const list = state.products.filter((prod) => {
        if (!state.isAdmin && prod.hidden) return false;
        if (state.filter === "promo" && !prod.isPromo) return false;
        if (state.filter !== "all" && state.filter !== "promo" && prod.category !== state.filter) return false;
        if (state.search) {
          const hay = `${prod.name || ""} ${prod.category || ""}`.toLowerCase();
          if (!hay.includes(state.search)) return false;
        }
        return true;
      });

      if (!list.length) {
        productsGrid.innerHTML = `<div class="empty-state">Nenhum produto encontrado nesta seção.</div>`;
        return;
      }

      productsGrid.innerHTML = list.map((prod) => {
        const hasPromo = Boolean(prod.isPromo && prod.promoPrice && Number(prod.promoPrice) > 0 && Number(prod.promoPrice) < Number(prod.price));
        const finalPrice = getEffectivePrice(prod);
        const fallbackImg = "https://via.placeholder.com/400x300?text=Produto";

        const adminActions = state.isAdmin ? `
          <div class="admin-mini-actions">
            <button type="button" class="mini-btn" onclick="window.__editProd('${prod.id}')">Editar</button>
            <button type="button" class="mini-btn" onclick="window.__toggleHideProd('${prod.id}')">${prod.hidden ? "Mostrar" : "Ocultar"}</button>
            <button type="button" class="mini-btn del" onclick="window.__deleteProd('${prod.id}')">Excluir</button>
          </div>
        ` : "";

        return `
          <article class="product-card">
            ${hasPromo ? `<span class="promo-tag">Promoção</span>` : ""}
            ${state.isAdmin && prod.hidden ? `<span class="hidden-tag">Oculto</span>` : ""}
            <div class="product-img-wrap">
              <img src="${escapeHTML(prod.photo || fallbackImg)}" alt="${escapeHTML(prod.name)}" onerror="this.src='${fallbackImg}'" />
            </div>
            <div class="product-body">
              <span class="product-cat">${escapeHTML(prod.category || "Geral")}</span>
              <h3 class="product-name">${escapeHTML(prod.name)}</h3>
              <div class="price-box">
                ${hasPromo ? `<span class="price-old">${formatBRL(prod.price)}</span>` : ""}
                <span class="price-now ${hasPromo ? "price-promo" : ""}">${formatBRL(finalPrice)}</span>
              </div>
              <button type="button" class="add-btn" onclick="window.__addToCart('${prod.id}')">+ Adicionar</button>
              ${adminActions}
            </div>
          </article>
        `;
      }).join("");
    }

    // Carrinho
    function updateCartBadge() {
      const totalQty = state.cart.reduce((acc, item) => acc + item.qty, 0);
      document.getElementById("cartCount").textContent = totalQty;
    }

    window.__addToCart = function (productId) {
      const prod = state.products.find((p) => p.id === productId);
      if (!prod) return;
      const existing = state.cart.find((item) => item.id === productId);
      if (existing) {
        existing.qty += 1;
        existing.price = getEffectivePrice(prod);
        existing.name = prod.name;
      } else {
        state.cart.push({
          id: prod.id,
          name: prod.name,
          price: getEffectivePrice(prod),
          qty: 1
        });
      }
      saveJSON(STORAGE_CART_KEY, state.cart);
      updateCartBadge();
      showNotice(`"${prod.name}" adicionado ao carrinho.`, "success");
    };

    window.__changeQty = function (productId, delta) {
      const idx = state.cart.findIndex((i) => i.id === productId);
      if (idx === -1) return;
      state.cart[idx].qty += delta;
      if (state.cart[idx].qty <= 0) {
        state.cart.splice(idx, 1);
      }
      saveJSON(STORAGE_CART_KEY, state.cart);
      updateCartBadge();
      renderCartModal();
    };

    const cartModal = document.getElementById("cartModal");

    function openCartModal() {
      renderCartModal();
      cartModal.classList.add("open");
    }

    function closeCartModal() {
      cartModal.classList.remove("open");
    }

    document.getElementById("openCartBtn").addEventListener("click", openCartModal);
    document.getElementById("closeCartModalBtn").addEventListener("click", closeCartModal);
    cartModal.addEventListener("click", (e) => {
      if (e.target === cartModal) closeCartModal();
    });

    function renderCartModal() {
      const listEl = document.getElementById("cartItemsList");
      const totalEl = document.getElementById("cartTotalText");
      const custBox = document.getElementById("checkoutCustomerBox");

      if (!state.cart.length) {
        listEl.innerHTML = `<p style="padding:14px 0; color:var(--muted); text-align:center;">Seu carrinho está vazio.</p>`;
        totalEl.textContent = formatBRL(0);
        custBox.style.display = "none";
        return;
      }

      let total = 0;
      listEl.innerHTML = state.cart.map((item) => {
        const sub = Number(item.price) * Number(item.qty);
        total += sub;
        return `
          <div class="cart-item">
            <div class="cart-item-info">
              <div class="cart-item-name">${escapeHTML(item.name)}</div>
              <div class="cart-item-sub">${formatBRL(item.price)} cada • Subtotal: ${formatBRL(sub)}</div>
            </div>
            <div class="qty-controls">
              <button type="button" class="qty-btn" onclick="window.__changeQty('${item.id}', -1)">-</button>
              <strong>${item.qty}</strong>
              <button type="button" class="qty-btn" onclick="window.__changeQty('${item.id}', 1)">+</button>
            </div>
          </div>
        `;
      }).join("");

      totalEl.textContent = formatBRL(total);

      if (state.user && state.profile) {
        custBox.style.display = "block";
        custBox.innerHTML = `
          <strong>Entrega para:</strong> ${escapeHTML(state.profile.name || state.user.email)}<br>
          <strong>Endereço:</strong> ${escapeHTML(state.profile.address || "")}<br>
          <strong>Ponto de referência:</strong> ${escapeHTML(state.profile.landmark || "")}
        `;
      } else {
        custBox.style.display = "block";
        custBox.innerHTML = `Para fechar o pedido sem perder seus itens, faça seu cadastro ou entre na sua conta.`;
      }
    }

    document.getElementById("finishOrderBtn").addEventListener("click", () => {
      if (!state.cart.length) {
        showNotice("Adicione ao menos um item ao carrinho antes de fechar o pedido.", "error");
        return;
      }

      const hasAddress = state.profile && state.profile.address && state.profile.landmark;
      if (!state.user || !hasAddress) {
        state.pendingCheckoutAfterAuth = true;
        closeCartModal();
        openAuthModal("register");
        setAuthMsg("Preencha seu cadastro com endereço e ponto de referência para fechar o pedido. Seu carrinho está salvo!", "ok");
        return;
      }

      sendOrderToWhatsApp();
    });

    function sendOrderToWhatsApp() {
      const phone = String((state.store && state.store.whatsapp) || "5585999999999").replace(/\D/g, "");
      let total = 0;
      const lines = state.cart.map((item) => {
        const sub = Number(item.price) * Number(item.qty);
        total += sub;
        return `- ${item.qty}x ${item.name} (${formatBRL(sub)})`;
      });

      const msg = [
        "*NOVO PEDIDO - MEU MERCADINHO ONLINE*",
        "",
        "*Itens:*",
        ...lines,
        "",
        `*Total:* ${formatBRL(total)}`,
        "",
        "*Dados para entrega:*",
        `Cliente: ${state.profile.name || state.user.email}`,
        `E-mail: ${state.user.email || ""}`,
        `Endereço: ${state.profile.address}`,
        `Ponto de referência: ${state.profile.landmark}`
      ].join("\n");

      const url = `https://wa.me/${phone}?text=${encodeURIComponent(msg)}`;
      closeCartModal();
      showNotice("Pedido preparado para o WhatsApp! Dentro de poucos minutos chega na sua casa.", "success");
      window.open(url, "_blank", "noopener,noreferrer");
    }

    // Modal de Cadastro e Login
    const authModal = document.getElementById("authModal");
    const registerForm = document.getElementById("registerForm");
    const loginForm = document.getElementById("loginForm");
    const switchRegisterBtn = document.getElementById("switchRegisterBtn");
    const switchLoginBtn = document.getElementById("switchLoginBtn");
    const authInlineMsg = document.getElementById("authInlineMsg");

    function setAuthMsg(text, kind = "ok") {
      authInlineMsg.textContent = text;
      authInlineMsg.className = `inline-msg show ${kind}`;
    }

    function clearAuthMsg() {
      authInlineMsg.textContent = "";
      authInlineMsg.className = "inline-msg";
    }

    function openAuthModal(mode = "register") {
      clearAuthMsg();
      if (state.profile) {
        document.getElementById("regName").value = state.profile.name || "";
        document.getElementById("regAddress").value = state.profile.address || "";
        document.getElementById("regLandmark").value = state.profile.landmark || "";
      }
      if (state.user && state.user.email) {
        document.getElementById("regEmail").value = state.user.email;
        document.getElementById("loginEmail").value = state.user.email;
      }
      switchAuthMode(mode);
      authModal.classList.add("open");
    }

    function closeAuthModal() {
      authModal.classList.remove("open");
    }

    function switchAuthMode(mode) {
      const isReg = mode === "register";
      switchRegisterBtn.classList.toggle("active", isReg);
      switchLoginBtn.classList.toggle("active", !isReg);
      registerForm.style.display = isReg ? "grid" : "none";
      loginForm.style.display = isReg ? "none" : "grid";
      clearAuthMsg();
    }

    switchRegisterBtn.addEventListener("click", () => switchAuthMode("register"));
    switchLoginBtn.addEventListener("click", () => switchAuthMode("login"));
    document.getElementById("closeAuthModalBtn").addEventListener("click", () => {
      state.pendingCheckoutAfterAuth = false;
      closeAuthModal();
    });
    authModal.addEventListener("click", (e) => {
      if (e.target === authModal) {
        state.pendingCheckoutAfterAuth = false;
        closeAuthModal();
      }
    });

    async function saveCustomerProfileToFirestore(uid, data) {
      const userRef = doc(db, "users", uid);
      try {
        await withTimeout(setDoc(userRef, data, { merge: true }), 7000);
        return { ok: true, error: null };
      } catch (err) {
        return { ok: false, error: err && err.message ? err.message : String(err) };
      }
    }

    // Cadastro: Aguarde... -> Salvo! -> fecha modal e volta à tela principal
    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("registerSubmitBtn");
      const name = document.getElementById("regName").value.trim();
      const email = document.getElementById("regEmail").value.trim();
      const password = document.getElementById("regPassword").value;
      const address = document.getElementById("regAddress").value.trim();
      const landmark = document.getElementById("regLandmark").value.trim();

      if (!name || !email || !password || !address || !landmark) {
        setAuthMsg("Preencha todos os campos, incluindo endereço e ponto de referência.", "err");
        return;
      }

      btn.disabled = true;
      btn.textContent = "Aguarde...";
      clearAuthMsg();

      try {
        let uid = state.user ? state.user.uid : null;
        if (!uid) {
          const cred = await withTimeout(createUserWithEmailAndPassword(auth, email, password), 9000);
          uid = cred.user.uid;
          state.user = cred.user;
        }

        const profileData = {
          name,
          email: email.toLowerCase(),
          address,
          landmark,
          updatedAt: serverTimestamp()
        };

        state.profile = { name, email: email.toLowerCase(), address, landmark };
        saveJSON(STORAGE_USER_PROFILE_KEY, state.profile);

        const fsResult = await saveCustomerProfileToFirestore(uid, profileData);
        await refreshAdminStatus(state.user);
        updateUserUI();

        btn.textContent = "Salvo!";
        setAuthMsg("Salvo!", "ok");

        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = "Salvar cadastro";
          closeAuthModal();

          if (!fsResult.ok) {
            showNotice(`Cadastro salvo no app, mas o Firestore retornou: ${fsResult.error}`, "error");
          } else if (state.pendingCheckoutAfterAuth) {
            state.pendingCheckoutAfterAuth = false;
            sendOrderToWhatsApp();
          } else {
            showNotice("Cadastro salvo! Você já pode navegar normalmente.", "success");
          }
        }, 550);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Salvar cadastro";
        setAuthMsg(err && err.message ? err.message : "Não foi possível concluir o cadastro.", "err");
      }
    });

    // Login: Aguarde... -> Salvo! -> fecha modal e entra na tela normal
    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const btn = document.getElementById("loginSubmitBtn");
      const email = document.getElementById("loginEmail").value.trim();
      const password = document.getElementById("loginPassword").value;

      btn.disabled = true;
      btn.textContent = "Aguarde...";
      clearAuthMsg();

      try {
        const cred = await withTimeout(signInWithEmailAndPassword(auth, email, password), 9000);
        state.user = cred.user;

        await loadUserProfileAndAdmin(cred.user);
        updateUserUI();
        renderProducts();

        btn.textContent = "Salvo!";
        setAuthMsg("Salvo!", "ok");

        setTimeout(() => {
          btn.disabled = false;
          btn.textContent = "Entrar na conta";
          closeAuthModal();

          if (state.pendingCheckoutAfterAuth) {
            state.pendingCheckoutAfterAuth = false;
            if (state.profile && state.profile.address && state.profile.landmark) {
              sendOrderToWhatsApp();
            } else {
              openCartModal();
            }
          } else {
            showNotice("Login realizado com sucesso!", "success");
          }
        }, 500);
      } catch (err) {
        btn.disabled = false;
        btn.textContent = "Entrar na conta";
        setAuthMsg(err && err.message ? err.message : "E-mail ou senha inválidos.", "err");
      }
    });

    async function refreshAdminStatus(user) {
      if (!user) {
        state.isAdmin = false;
        return;
      }
      let adminFound = false;
      try {
        const emailLower = String(user.email || "").toLowerCase();
        if (emailLower) {
          const adminDoc = await withTimeout(getDoc(doc(db, "admins", emailLower)), 5000);
          if (adminDoc.exists() && adminDoc.data().active === true) {
            adminFound = true;
          }
        }
      } catch {}

      try {
        const userDoc = await withTimeout(getDoc(doc(db, "users", user.uid)), 5000);
        if (userDoc.exists() && userDoc.data().isAdmin === true) {
          adminFound = true;
        }
      } catch {}

      state.isAdmin = adminFound;
    }

    async function loadUserProfileAndAdmin(user) {
      if (!user) return;
      try {
        const userSnap = await withTimeout(getDoc(doc(db, "users", user.uid)), 6000);
        if (userSnap.exists()) {
          const d = userSnap.data();
          state.profile = {
            name: d.name || "",
            email: d.email || user.email || "",
            address: d.address || "",
            landmark: d.landmark || ""
          };
          saveJSON(STORAGE_USER_PROFILE_KEY, state.profile);
        }
      } catch {}
      await refreshAdminStatus(user);
    }

    onAuthStateChanged(auth, async (user) => {
      state.user = user || null;
      if (user) {
        await loadUserProfileAndAdmin(user);
      } else {
        state.isAdmin = false;
      }
      updateUserUI();
      renderProducts();
    });

    // Sincronização em tempo real do catálogo e configurações no Firestore
    try {
      onSnapshot(collection(db, "products"), (snap) => {
        if (!snap.empty) {
          const items = [];
          snap.forEach((d) => items.push({ id: d.id, ...d.data() }));
          state.products = items;
          saveJSON(STORAGE_PRODUCTS_KEY, state.products);
          renderProducts();
        }
      }, () => {});
    } catch {}

    try {
      onSnapshot(doc(db, "settings", "store"), (snap) => {
        if (snap.exists()) {
          state.store = { ...state.store, ...snap.data() };
          saveJSON(STORAGE_STORE_KEY, state.store);
          document.getElementById("storeWhatsapp").value = state.store.whatsapp || "";
        }
      }, () => {});
    } catch {}

    // Ações do Administrador
    const tabProductBtn = document.getElementById("tabProductBtn");
    const tabStoreBtn = document.getElementById("tabStoreBtn");
    const adminProductTab = document.getElementById("adminProductTab");
    const adminStoreTab = document.getElementById("adminStoreTab");

    tabProductBtn.addEventListener("click", () => {
      tabProductBtn.classList.add("active");
      tabStoreBtn.classList.remove("active");
      adminProductTab.style.display = "block";
      adminStoreTab.style.display = "none";
    });

    tabStoreBtn.addEventListener("click", () => {
      tabStoreBtn.classList.add("active");
      tabProductBtn.classList.remove("active");
      adminProductTab.style.display = "none";
      adminStoreTab.style.display = "block";
      document.getElementById("storeWhatsapp").value = state.store.whatsapp || "";
    });

    document.getElementById("closeAdminPanelBtn").addEventListener("click", () => {
      document.getElementById("adminPanel").classList.remove("active");
    });

    function resetProductForm() {
      document.getElementById("editProductId").value = "";
      document.getElementById("productForm").reset();
      document.getElementById("saveProductBtn").textContent = "Salvar produto";
    }

    document.getElementById("resetProductFormBtn").addEventListener("click", resetProductForm);

    document.getElementById("productForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!state.isAdmin) return;

      const btn = document.getElementById("saveProductBtn");
      btn.disabled = true;
      btn.textContent = "Aguarde...";

      const existingId = document.getElementById("editProductId").value.trim();
      const id = existingId || `prod_${Date.now()}`;
      const promoVal = parseFloat(document.getElementById("prodPromoPrice").value);

      const prodData = {
        name: document.getElementById("prodName").value.trim(),
        category: document.getElementById("prodCategory").value,
        price: parseFloat(document.getElementById("prodPrice").value),
        promoPrice: Number.isFinite(promoVal) && promoVal > 0 ? promoVal : null,
        isPromo: document.getElementById("prodIsPromo").checked,
        hidden: document.getElementById("prodHidden").checked,
        photo: document.getElementById("prodPhoto").value.trim(),
        updatedAt: serverTimestamp()
      };

      try {
        await withTimeout(setDoc(doc(db, "products", id), prodData, { merge: true }), 7000);
        const idx = state.products.findIndex((p) => p.id === id);
        const localItem = { id, ...prodData };
        if (idx >= 0) state.products[idx] = localItem;
        else state.products.unshift(localItem);
        saveJSON(STORAGE_PRODUCTS_KEY, state.products);
        renderProducts();
        resetProductForm();
        showNotice("Produto salvo com sucesso.", "success");
      } catch (err) {
        showNotice(`Erro ao salvar produto: ${err && err.message ? err.message : err}`, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Salvar produto";
      }
    });

    window.__editProd = function (id) {
      const prod = state.products.find((p) => p.id === id);
      if (!prod) return;
      document.getElementById("adminPanel").classList.add("active");
      tabProductBtn.click();
      document.getElementById("editProductId").value = prod.id;
      document.getElementById("prodName").value = prod.name || "";
      document.getElementById("prodCategory").value = prod.category || "Mercearia";
      document.getElementById("prodPrice").value = prod.price || "";
      document.getElementById("prodPromoPrice").value = prod.promoPrice || "";
      document.getElementById("prodPhoto").value = prod.photo || "";
      document.getElementById("prodIsPromo").checked = Boolean(prod.isPromo);
      document.getElementById("prodHidden").checked = Boolean(prod.hidden);
      document.getElementById("saveProductBtn").textContent = "Atualizar produto";
      document.getElementById("adminPanel").scrollIntoView({ behavior: "smooth" });
    };

    window.__toggleHideProd = async function (id) {
      const prod = state.products.find((p) => p.id === id);
      if (!prod || !state.isAdmin) return;
      const nextHidden = !prod.hidden;
      try {
        await withTimeout(updateDoc(doc(db, "products", id), { hidden: nextHidden }), 7000);
        prod.hidden = nextHidden;
        saveJSON(STORAGE_PRODUCTS_KEY, state.products);
        renderProducts();
        showNotice(nextHidden ? "Produto ocultado dos clientes." : "Produto visível no catálogo.", "success");
      } catch (err) {
        showNotice(`Erro ao atualizar visibilidade: ${err && err.message ? err.message : err}`, "error");
      }
    };

    window.__deleteProd = async function (id) {
      if (!state.isAdmin) return;
      try {
        await withTimeout(deleteDoc(doc(db, "products", id)), 7000);
        state.products = state.products.filter((p) => p.id !== id);
        saveJSON(STORAGE_PRODUCTS_KEY, state.products);
        renderProducts();
        showNotice("Produto excluído.", "success");
      } catch (err) {
        showNotice(`Erro ao excluir produto: ${err && err.message ? err.message : err}`, "error");
      }
    };

    document.getElementById("storeConfigForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!state.isAdmin) return;
      const btn = document.getElementById("saveStoreBtn");
      btn.disabled = true;
      btn.textContent = "Aguarde...";
      const whatsapp = document.getElementById("storeWhatsapp").value.replace(/\D/g, "");
      try {
        await withTimeout(setDoc(doc(db, "settings", "store"), { whatsapp }, { merge: true }), 7000);
        state.store.whatsapp = whatsapp;
        saveJSON(STORAGE_STORE_KEY, state.store);
        showNotice("WhatsApp da loja salvo.", "success");
      } catch (err) {
        showNotice(`Erro ao salvar WhatsApp: ${err && err.message ? err.message : err}`, "error");
      } finally {
        btn.disabled = false;
        btn.textContent = "Salvar WhatsApp";
      }
    });

    // Inicialização
    updateCartBadge();
    updateUserUI();
    renderProducts();
  </script>
</body>
</html>
